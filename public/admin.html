<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>摄影测试 - 管理员后台</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        input, button { padding: 8px 12px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>📊 摄影测试答题监控后台</h1>

    <div class="card" id="login-section">
        <h3>管理员登录</h3>
        <input type="password" id="admin-pass" placeholder="请输入管理员密码">
        <button onclick="fetchRecords()">登录查看记录</button>
    </div>

    <div class="card" id="data-section" style="display: none;">
        <h3>答题记录总览（满分 75 分）</h3>
        <button onclick="fetchRecords()">🔄 刷新数据</button>
        <table>
            <thead>
                <tr>
                    <th>提交时间</th>
                    <th>考生姓名</th>
                    <th>最终得分</th>
                    <th>各题勾选详情</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        function fetchRecords() {
            const password = document.getElementById('admin-pass').value;

            fetch('/api/admin/records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            })
            .then(res => res.json())
            .then(res => {
                if (!res.success) {
                    alert(res.message);
                    return;
                }

                document.getElementById('login-section').style.display = 'none';
                document.getElementById('data-section').style.display = 'block';

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                res.data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.submittedAt}</td>
                        <td><b>${item.username}</b></td>
                        <td><b style="color: red; font-size: 16px;">${item.score}</b> / 75</td>
                        <td><code>${JSON.stringify(item.details)}</code></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => alert('网络错误，无法获取数据'));
        }
    </script>
</body>
</html>
