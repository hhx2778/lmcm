<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>招新考试后台管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="bg-slate-800 text-white px-4 py-3 sticky top-0 z-10 shadow">
  <div class="text-lg font-bold text-center">传媒社招新考试后台</div>
</div>

<div class="px-4 py-4 max-w-2xl mx-auto">

  <!-- 登录 -->
  <div id="loginBox" class="bg-white rounded-xl p-6 shadow-sm">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🔐</div>
      <h2 class="text-lg font-bold">管理员登录</h2>
    </div>
    <input type="password" id="pwdInput" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base mb-4 focus:outline-none focus:border-blue-500" placeholder="请输入管理员密码">
    <button id="loginBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold active:bg-blue-700">登录</button>
  </div>

  <!-- 管理面板 -->
  <div id="panelBox" class="hidden">

    <!-- 统计卡片 -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div class="bg-white rounded-xl p-3 shadow-sm text-center">
        <div class="text-xl font-bold text-blue-600" id="totalCount">0</div>
        <div class="text-xs text-gray-500 mt-1">答卷总数</div>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm text-center">
        <div class="text-xl font-bold text-green-600" id="avgScore">0</div>
        <div class="text-xs text-gray-500 mt-1">平均分</div>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm text-center">
        <div class="text-xl font-bold text-orange-600" id="maxScore">0</div>
        <div class="text-xs text-gray-500 mt-1">最高分</div>
      </div>
    </div>

    <!-- 分数分布 -->
    <div class="bg-white rounded-xl p-4 shadow-sm mb-4">
      <div class="text-sm font-medium text-gray-700 mb-3">分数分布</div>
      <div id="distribution" class="space-y-2 text-xs"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <button id="refreshBtn" class="bg-green-600 text-white py-3 rounded-lg text-sm font-medium active:bg-green-700">刷新</button>
      <button id="exportBtn" class="bg-slate-700 text-white py-3 rounded-lg text-sm font-medium active:bg-slate-800">导出</button>
      <button id="clearBtn" class="bg-red-600 text-white py-3 rounded-lg text-sm font-medium active:bg-red-700">清空</button>
    </div>

    <!-- 答卷列表 -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 font-medium text-sm text-gray-700 flex justify-between items-center">
        <span>考生成绩列表</span>
        <span id="listCount" class="text-xs text-gray-400">0人</span>
      </div>
      <div id="recordList"></div>
    </div>

    <a href="/" class="block text-center mt-6 text-blue-600 text-sm">返回答题页 →</a>
  </div>

  <!-- 详情弹窗 -->
  <div id="detailMask" class="fixed inset-0 bg-black/50 z-30 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[80vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-3 flex justify-between items-center">
        <div class="font-bold">答卷详情</div>
        <button onclick="closeDetail()" class="text-gray-400 text-2xl leading-none">&times;</button>
      </div>
      <div id="detailContent" class="p-4"></div>
    </div>
  </div>

</div>

<script>
let adminPassword = '';

document.getElementById('loginBtn').onclick = async function() {
  const pwd = document.getElementById('pwdInput').value;
  if (!pwd) { alert('请输入密码'); return; }

  // 验证密码（通过请求统计接口）
  try {
    const res = await fetch('/api/stats?password=' + encodeURIComponent(pwd));
    if (res.status === 401) {
      alert('密码错误');
      return;
    }
    adminPassword = pwd;
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelBox').classList.remove('hidden');
    loadData();
  } catch (e) {
    alert('登录失败，请检查网络');
  }
};

async function loadData() {
  try {
    const [statsRes, recordsRes] = await Promise.all([
      fetch('/api/stats?password=' + encodeURIComponent(adminPassword)),
      fetch('/api/records?password=' + encodeURIComponent(adminPassword))
    ]);
    const stats = await statsRes.json();
    const recordsData = await recordsRes.json();

    // 统计
    document.getElementById('totalCount').textContent = stats.total;
    document.getElementById('avgScore').textContent = stats.avgScore;
    document.getElementById('maxScore').textContent = stats.maxScore;

    // 分数分布
    const dist = stats.distribution;
    const distHtml = Object.entries(dist).map(([range, count]) => {
      const pct = stats.total > 0 ? (count / stats.total * 100) : 0;
      const color = range === '45-50' ? 'bg-green-500' : range === '38-44' ? 'bg-blue-500' : range === '30-37' ? 'bg-yellow-500' : range === '20-29' ? 'bg-orange-500' : 'bg-red-500';
      return `<div class="flex items-center gap-2">
        <span class="w-12 text-gray-600">${range}分</span>
        <div class="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden">
          <div class="${color} h-full rounded-full" style="width:${pct}%"></div>
        </div>
        <span class="w-8 text-right text-gray-500">${count}</span>
      </div>`;
    }).join('');
    document.getElementById('distribution').innerHTML = distHtml;

    // 列表
    const records = recordsData.records;
    document.getElementById('listCount').textContent = records.length + '人';
    const listDom = document.getElementById('recordList');
    if (records.length === 0) {
      listDom.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">暂无答卷记录</div>';
    } else {
      listDom.innerHTML = records.map(r => {
        const scoreColor = r.score >= 38 ? 'text-green-600' : r.score >= 30 ? 'text-blue-600' : 'text-orange-600';
        return `<div class="px-4 py-3 border-b border-gray-50 last:border-0 active:bg-gray-50 cursor-pointer" onclick="showDetail('${r.id}')">
          <div class="flex justify-between items-center">
            <div class="font-medium">${r.username}</div>
            <div class="text-lg font-bold ${scoreColor}">${r.score}分</div>
          </div>
          <div class="text-xs text-gray-500 mt-1 truncate">${r.level}</div>
          <div class="text-xs text-gray-400 mt-1">${r.time}</div>
        </div>`;
      }).join('');
    }
  } catch (e) {
    alert('加载数据失败');
  }
}

async function showDetail(id) {
  try {
    const res = await fetch('/api/records/' + id + '?password=' + encodeURIComponent(adminPassword));
    const record = await res.json();
    if (!record.answers) { alert('获取详情失败'); return; }

    // 标准答案
    const answerKey = {1:"B",2:"C",3:"B",4:"C",5:"B",6:"C",7:"B",8:"A",9:"D",10:"B",11:"B",12:"B",13:"B",14:"B",15:"A",16:"B",17:"C",18:"C",19:"C",20:"B",21:"B",22:"C",23:"B",24:"C",25:"B",26:"A",27:"B",28:"A",29:"B",30:"B",31:"ABC",32:"ABCD",33:"ABC",34:"ABC",35:"ABCD",36:"ABCD",37:"ABC",38:"ABC",39:"ABCD",40:"ABC"};

    let html = `<div class="mb-4">
      <div class="text-lg font-bold">${record.username}</div>
      <div class="text-sm text-gray-500">得分：<span class="text-xl font-bold text-red-600">${record.score}</span>/50｜${record.time}</div>
      <div class="text-sm text-gray-600 mt-1">${record.level}</div>
    </div>
    <div class="space-y-3">`;

    for (let i = 1; i <= 40; i++) {
      const my = record.answers[i] || '未答';
      const std = answerKey[i];
      const correct = my.toUpperCase() === std;
      const type = i <= 30 ? '单选' : '多选';
      html += `<div class="border rounded-lg p-3 ${correct ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}">
        <div class="flex justify-between items-center text-sm">
          <span class="font-medium">第${i}题（${type}）</span>
          <span class="${correct ? 'text-green-600' : 'text-red-600'} font-bold">${correct ? '✓ 正确' : '✗ 错误'}</span>
        </div>
        <div class="text-xs text-gray-600 mt-1">你的答案：<b>${my}</b>｜正确答案：<b>${std}</b></div>
      </div>`;
    }
    html += '</div>';

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailMask').classList.remove('hidden');
  } catch (e) {
    alert('获取详情失败');
  }
}

function closeDetail() {
  document.getElementById('detailMask').classList.add('hidden');
}

document.getElementById('refreshBtn').onclick = loadData;

document.getElementById('exportBtn').onclick = function() {
  window.open('/api/export?password=' + encodeURIComponent(adminPassword), '_blank');
};

document.getElementById('clearBtn').onclick = async function() {
  if (!confirm('确定清空所有答卷记录？此操作不可恢复！')) return;
  try {
    const res = await fetch('/api/records?password=' + encodeURIComponent(adminPassword), { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      alert('已清空');
      loadData();
    } else {
      alert('清空失败');
    }
  } catch (e) {
    alert('清空失败');
  }
};

// 回车登录
document.getElementById('pwdInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
